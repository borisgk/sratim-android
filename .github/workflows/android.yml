name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      # --build-cache uses the Gradle Build Cache for faster builds
      run: ./gradlew assembleDebug --build-cache

    - name: Upload APKs
      uses: actions/upload-artifact@v7
      with:
        name: android-apks
        path: |
          app-tv/build/outputs/apk/debug/*.apk
          app-mobile/build/outputs/apk/debug/*.apk

  release:
    needs: build
    # Only run release on push to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v7
    
    - name: Download APKs
      uses: actions/download-artifact@v7
      with:
        name: android-apks

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Install semantic-release and required plugins
        npm install semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/github
        npx semantic-release
