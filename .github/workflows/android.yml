name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true
    
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Compute Version
      id: version
      run: |
        LATEST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*.[0-9]*.[0-9]*" 2>/dev/null || echo "")
        if [ -z "$LATEST_TAG" ]; then
          VERSION_NAME=$(grep '^VERSION_NAME=' gradle.properties | cut -d'=' -f2)
          VERSION_CODE=$(grep '^VERSION_CODE=' gradle.properties | cut -d'=' -f2)
        else
          CLEAN_TAG="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_TAG"
          MAJOR=$((10#$MAJOR))
          MINOR=$((10#$MINOR))
          PATCH=$((10#$PATCH))

          BUMP="none"
          while IFS= read -r SHA; do
            [ -z "$SHA" ] && continue
            SUBJECT=$(git show -s --format='%s' "$SHA")
            BODY=$(git show -s --format='%b' "$SHA")
            if echo "$SUBJECT" | grep -qE '^[a-zA-Z]+(\([^)]+\))?!:' || echo "$BODY" | grep -qE '^BREAKING[ -]CHANGE:'; then
              BUMP="major"
              break
            elif echo "$SUBJECT" | grep -qE '^feat(\([^)]+\))?:'; then
              BUMP="minor"
            elif [ "$BUMP" = "none" ] && echo "$SUBJECT" | grep -qE '^(fix|perf|revert)(\([^)]+\))?:'; then
              BUMP="patch"
            fi
          done < <(git rev-list "${LATEST_TAG}..HEAD")

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
        fi

        echo "Resolved build version: ${VERSION_NAME} (versionCode=${VERSION_CODE})"
        echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
        echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Prepare Signing Key
      run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks
      
    - name: Build with Gradle
      # --build-cache uses the Gradle Build Cache for faster builds
      run: ./gradlew assembleRelease --build-cache -PVERSION_NAME="${{ steps.version.outputs.name }}" -PVERSION_CODE="${{ steps.version.outputs.code }}"
      env:
        KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        ALIAS: ${{ secrets.ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload APKs
      uses: actions/upload-artifact@v7
      with:
        name: android-apks
        path: |
          app-tv/build/outputs/apk/release/*.apk
          app-mobile/build/outputs/apk/release/*.apk

  release:
    needs: build
    # Only run release on push to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v7
    
    - name: Download APKs
      uses: actions/download-artifact@v8
      with:
        name: android-apks

    - name: Setup Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Release dependencies
      run: npm ci

    - name: Run Semantic Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npx semantic-release --debug
