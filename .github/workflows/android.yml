name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Prepare Signing Key
      run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks
      
    - name: Build with Gradle
      # --build-cache uses the Gradle Build Cache for faster builds
      run: ./gradlew assembleRelease --build-cache
      env:
        KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        ALIAS: ${{ secrets.ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload APKs
      uses: actions/upload-artifact@v7
      with:
        name: android-apks
        path: |
          app-tv/build/outputs/apk/release/*.apk
          app-mobile/build/outputs/apk/release/*.apk

  release:
    needs: build
    # Only run release on push to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v7
    
    - name: Download APKs
      uses: actions/download-artifact@v8
      with:
        name: android-apks

    - name: Setup Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Release dependencies
      run: npm ci

    - name: Run Semantic Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npx semantic-release --debug
